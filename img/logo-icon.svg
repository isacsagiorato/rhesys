<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rheBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado com gradiente verde -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#rheBg)"/>
  <ellipse cx="256" cy="112" rx="200" ry="88" fill="#ffffff" opacity="0.13"/>

  <g transform="translate(256,256)">
    <!-- Ciclo de reciclagem (duas setas em rotação) -->
    <path d="M 65 -112.6 A 130 130 0 0 1 65 112.6" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <path d="M -26 -20 L 6 0 L -26 20" transform="translate(65,112.6) rotate(150)" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -65 112.6 A 130 130 0 0 1 -65 -112.6" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <path d="M -26 -20 L 6 0 L -26 20" transform="translate(-65,-112.6) rotate(-30)" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nodos de circuito (tecnologia) -->
    <line x1="65" y1="-112.6" x2="82" y2="-142" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="90" cy="-156" r="13" fill="#dcfce7"/>
    <line x1="-65" y1="112.6" x2="-82" y2="142" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-90" cy="156" r="13" fill="#dcfce7"/>

    <!-- Folha central (sustentabilidade) com "circuitos" -->
    <path d="M 0 -88 C 46 -56 56 20 0 88 C -56 20 -46 -56 0 -88 Z" fill="#ffffff"/>
    <path d="M 0 -58 C 9 -8 9 24 0 58" fill="none" stroke="#166534" stroke-width="10" stroke-linecap="round"/>
    <path d="M 0 -16 C 13 -10 21 -2 25 8" fill="none" stroke="#166534" stroke-width="7" stroke-linecap="round"/>
    <path d="M 0 -16 C -13 -10 -21 -2 -25 8" fill="none" stroke="#166534" stroke-width="7" stroke-linecap="round"/>
    <circle cx="25" cy="10" r="6" fill="#166534"/>
    <circle cx="-25" cy="10" r="6" fill="#166534"/>
  </g>
</svg>