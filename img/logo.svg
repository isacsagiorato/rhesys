<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <!-- Gradiente verde sustentabilidade -->
    <linearGradient id="gradLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#1a7a45"/>
    </linearGradient>
    <!-- Gradiente do brilho tecnológico -->
    <linearGradient id="gradCircuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#0d6efd"/>
    </linearGradient>
  </defs>

  <!-- ===== ÍCONE (círculo com folha + circuito) ===== -->
  <g transform="translate(8, 4)">
    <!-- Círculo de fundo -->
    <circle cx="28" cy="28" r="26" fill="url(#gradLeaf)"/>
    <circle cx="28" cy="28" r="26" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

    <!-- Folha estilizada (nervura central) -->
    <path d="M 28 10 Q 14 22 14 36 Q 14 46 28 46 Q 42 46 42 36 Q 42 22 28 10 Z"
          fill="#ffffff" opacity="0.95"/>
    <!-- Nervura central da folha -->
    <line x1="28" y1="12" x2="28" y2="44" stroke="url(#gradCircuit)" stroke-width="2" stroke-linecap="round"/>

    <!-- Nodos de circuito (nervuras laterais com pontos) -->
    <!-- Lado esquerdo -->
    <path d="M 28 20 Q 22 22 20 26" fill="none" stroke="url(#gradCircuit)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="20" cy="26" r="2" fill="#0d6efd"/>

    <path d="M 28 28 Q 22 30 19 34" fill="none" stroke="url(#gradCircuit)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="19" cy="34" r="2" fill="#0d6efd"/>

    <!-- Lado direito -->
    <path d="M 28 20 Q 34 22 36 26" fill="none" stroke="url(#gradCircuit)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="36" cy="26" r="2" fill="#0d6efd"/>

    <path d="M 28 28 Q 34 30 37 34" fill="none" stroke="url(#gradCircuit)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="37" cy="34" r="2" fill="#0d6efd"/>

    <!-- Setas de reciclagem sutis nos cantos -->
    <path d="M 14 14 L 10 18 L 14 18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path d="M 42 14 L 46 18 L 42 18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>

  <!-- ===== TEXTO "Rhesys" ===== -->
  <g transform="translate(72, 0)">
    <!-- "Rhe" em verde -->
    <text x="0" y="42" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="32" font-weight="700" fill="#1a7a45">Rhe</text>
    <!-- "sys" em azul tecnológico -->
    <text x="63" y="42" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="32" font-weight="700" fill="#0d6efd">sys</text>
    <!-- Tagline -->
    <text x="0" y="56" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="9" font-weight="400" fill="#6c757d" letter-spacing="2">SUSTENTABILIDADE & TECNOLOGIA</text>
  </g>
</svg>